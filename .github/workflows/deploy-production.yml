name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., git SHA) to deploy. Defaults to current workflow commit SHA.'
        required: false
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://payment-watchdog.example.com  # Update with your actual production URL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Kubeconfig
        id: decode
        run: |
          DECODED_FILE=$(mktemp)
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$DECODED_FILE"

          # Use dynamic EOF marker to handle multiline output safely
          EOF_MARKER=$(head -c 16 /dev/urandom | od -An -t x | tr -d ' \n')
          echo "kubeconfig<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
          cat "$DECODED_FILE" >> "$GITHUB_OUTPUT"
          # Ensure trailing newline
          echo "" >> "$GITHUB_OUTPUT"
          echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"

          rm "$DECODED_FILE"

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ steps.decode.outputs.kubeconfig }}

      - name: Set namespace context
        run: |
          kubectl config set-context --current --namespace=production

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "Using provided image tag: ${{ inputs.image_tag }}"
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "No image tag provided. Defaulting to workflow sha: ${{ github.sha }}"
            echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Update production deployment
        run: |
          cd api/deployments/kubernetes

          # Update image tags using kustomize
          IMAGE_TAG=${{ steps.tag.outputs.image_tag }}

          cd apps/payment-watchdog-api
          kustomize edit set image payment-watchdog-api=ghcr.io/${{ github.repository }}/api:${IMAGE_TAG}

          cd ../..
          cd apps/payment-watchdog-web
          kustomize edit set image payment-watchdog-ui=ghcr.io/${{ github.repository }}/web:${IMAGE_TAG}

          cd ../..
          cd apps/recovery-orchestration
          kustomize edit set image payment-watchdog-recovery-orchestration=ghcr.io/${{ github.repository }}/worker:${IMAGE_TAG}

          cd ../..

          # Deploy to production namespace
          kubectl apply -k --validate=false .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/payment-watchdog-api --timeout=300s
          kubectl rollout status deployment/payment-watchdog-ui --timeout=300s
          kubectl rollout status deployment/recovery-orchestration --timeout=300s

      - name: Run smoke tests
        run: |
          # Test API health
          kubectl exec deployment/payment-watchdog-api -- curl -s -f http://localhost:8080/health

          # Test web accessibility
          WEB_POD=$(kubectl get pods -l app=payment-watchdog,component=ui -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $WEB_POD -- curl -s -f http://localhost:3011

      - name: Rollback on failure
        if: failure()
        run: |
            echo "🚨 Deployment failed - initiating rollback"
            kubectl rollout undo deployment/payment-watchdog-api
            kubectl rollout undo deployment/payment-watchdog-ui
            kubectl rollout undo deployment/recovery-orchestration
