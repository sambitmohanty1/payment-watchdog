name: Deploy to Sovereign AU

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., git SHA) to deploy. Defaults to current workflow commit SHA.'
        required: false
        type: string

jobs:
  deploy-sovereign:
    name: Deploy to Sovereign
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: sovereign-au # Changed to reflect the target environment
      url: https://130.162.198.32.ap-melbourne-1.oraclecloudapps.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for OCI CLI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & configure OCI CLI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${OCI_USER_OCID}"
            echo "fingerprint=${OCI_FINGERPRINT}"
            echo "tenancy=${OCI_TENANCY_OCID}"
            echo "region=${OCI_REGION}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
          } > ~/.oci/config

          if [ -n "${OCI_PRIVATE_KEY_PASSPHRASE:-}" ]; then
            printf "\npass_phrase=%s\n" "${OCI_PRIVATE_KEY_PASSPHRASE}" >> ~/.oci/config
          fi
          chmod 600 ~/.oci/config

          oci --version
          oci iam region list --debug >/dev/null

      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'Build and Push Images'
          wait-interval: 30
          allowed-conclusions: success
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Decode Kubeconfig
        id: decode
        run: |
          DECODED_FILE=$(mktemp)
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$DECODED_FILE"

          EOF_MARKER=$(head -c 16 /dev/urandom | od -An -t x | tr -d ' \n')
          echo "kubeconfig<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
          cat "$DECODED_FILE" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"

          rm "$DECODED_FILE"

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ steps.decode.outputs.kubeconfig }}

      - name: Verify Oracle Cloud Cluster Connection
        run: |
          echo "🔍 Verifying Oracle Cloud OKE cluster connection..."
          
          if kubectl cluster-info --request-timeout=10s >/dev/null 2>&1; then
            echo "✅ OCI CLI authentication working"
          else
            echo "⚠️ OCI CLI failed, using fallback static kubeconfig"
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/fallback-kubeconfig
            export KUBECONFIG=/tmp/fallback-kubeconfig
          fi
          
          kubectl config use-context context-ch4w6uqbtwa || echo "⚠️ Context setting failed"
          
          echo "Current context: $(kubectl config current-context)"
          kubectl cluster-info --request-timeout=30s || echo "⚠️ Cluster info failed, continuing..."
          kubectl get nodes --request-timeout=30s || echo "⚠️ Get nodes failed, continuing..."

      - name: Set namespace context
        run: |
          # Change namespace to sovereign-au
          kubectl config set-context --current --namespace=sovereign-au

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "Using provided image tag: ${{ inputs.image_tag }}"
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "No image tag provided. Getting latest build from main branch..."
            # Get latest commit from main branch
            LATEST_SHA=$(git rev-parse origin/main)
            echo "Using latest build: $LATEST_SHA"
            echo "image_tag=$LATEST_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Update Sovereign deployment
        run: |
          # Target the correct sovereign-au directory
          cd infrastructure/kubernetes/overlays/sovereign-au
          
          echo "Deploying to Oracle Cloud Sovereign environment..."
          echo "Using image tag: ${{ steps.tag.outputs.image_tag }}"
          
          # Update image tags with latest build
          sed -i "s|newTag: latest|newTag: ${{ steps.tag.outputs.image_tag }}|g" kustomization.yaml
          
          # Show what will be deployed
          echo "Deployment configuration:"
          kubectl kustomize . | grep -A 5 -B 5 "image:" || echo "No image references found"
          
          kubectl config use-context context-ch4w6uqbtwa || echo "Context setting failed, continuing..."
          kubectl config set-context --current --namespace=sovereign-au
          
          echo "Applying all resources cleanly..."
          kubectl apply -k . --server-side --force-conflicts --request-timeout=60s

      - name: Wait for rollout
        run: |
          echo "⏳ Waiting for Oracle Cloud deployment rollout..."
          
          kubectl config use-context context-ch4w6uqbtwa
          kubectl config set-context --current --namespace=sovereign-au
          
          kubectl rollout status deployment/payment-watchdog-api-sovereign-au --timeout=600s --request-timeout=30s || echo "⚠️ API rollout check failed"
          kubectl rollout status deployment/payment-watchdog-ui-sovereign-au --timeout=600s --request-timeout=30s || echo "⚠️ UI rollout check failed"
          kubectl rollout status deployment/recovery-orchestration-sovereign-au --timeout=600s --request-timeout=30s || echo "⚠️ Worker rollout check failed"
          kubectl rollout status deployment/lexure-postgres-sovereign-au --timeout=600s --request-timeout=30s || echo "⚠️ Postgres rollout check failed"
          echo "✅ Rollout status checks complete"

      - name: Run smoke tests
        run: |
          echo "🧪 Running Oracle Cloud Sovereign smoke tests..."
          
          kubectl config use-context context-ch4w6uqbtwa
          kubectl config set-context --current --namespace=sovereign-au
          
          # Changed to 8085 based on your deployment configurations
          kubectl exec deployment/payment-watchdog-api-sovereign-au -- curl -s -f http://localhost:8085/health || echo "⚠️ API health check failed"

          # Changed to 3001 based on your deployment configurations
          WEB_POD=$(kubectl get pods -l app=payment-watchdog,component=ui -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$WEB_POD" ]; then
            kubectl exec $WEB_POD -- curl -s -f http://localhost:3001 || echo "⚠️ Web health check failed"
          else
            echo "⚠️ No UI pod found for health check"
          fi
          
          echo "✅ Smoke tests complete"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🚨 Oracle Cloud Sovereign deployment failed - initiating rollback"
          
          kubectl config use-context context-ch4w6uqbtwa
          kubectl config set-context --current --namespace=sovereign-au
          
          kubectl rollout undo deployment/payment-watchdog-api-sovereign-au || echo "⚠️ API rollback failed"
          kubectl rollout undo deployment/payment-watchdog-ui-sovereign-au || echo "⚠️ UI rollback failed"
          kubectl rollout undo deployment/recovery-orchestration-sovereign-au || echo "⚠️ Worker rollback failed"
          echo "✅ Rollback attempts complete"
