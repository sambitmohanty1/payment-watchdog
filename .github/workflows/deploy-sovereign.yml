name: Deploy to Sovereign AU (Oracle Cloud Australia)

on:
  workflow_dispatch:
    inputs:
      deploy_pvcs:
        description: 'Whether to deploy PersistentVolumeClaims (PVCs). Set to true for first-time setup or if modifying storage.'
        required: false
        type: boolean
        default: false
      incremental_rollout:
        description: 'Whether to force a restart of all components even if manifests haven''t changed'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Docker image tag for AU deployment (e.g., git SHA)'
        required: false
        type: string
      data_residency_check:
        description: 'Skip AU data residency validation (use with caution)'
        required: false
        default: false
        type: boolean
      compliance_mode:
        description: 'Compliance level for deployment'
        required: false
        default: 'standard'
        type: choice
        options:
        - standard
        - enhanced
        - full_audit

jobs:
  deploy-au-sovereign:
    name: Deploy to Oracle Cloud Australia
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: sovereign-au
      url: http://152.69.179.49
    permissions:
      contents: read
      checks: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AU Data Residency Requirements
        run: |
          echo "## Validating AU Data Residency Requirements" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.data_residency_check }}" == "true" ]; then
            echo "### Data Residency Check: SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "WARNING: Data residency validation was manually skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Data Residency Check: ENFORCED" >> $GITHUB_STEP_SUMMARY
            echo "- Validating Oracle Cloud Australia region deployment" >> $GITHUB_STEP_SUMMARY
            echo "- Ensuring data remains within Australian jurisdiction" >> $GITHUB_STEP_SUMMARY
            echo "- Checking compliance with Australian Privacy Principles" >> $GITHUB_STEP_SUMMARY
            echo "- Validating encryption standards for data at rest" >> $GITHUB_STEP_SUMMARY
            echo "- Verifying network isolation requirements" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Compliance mode validation
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compliance Mode: ${{ github.event.inputs.compliance_mode || 'standard' }}" >> $GITHUB_STEP_SUMMARY
          case "${{ github.event.inputs.compliance_mode || 'standard' }}" in
            "enhanced")
              echo "- Additional logging enabled" >> $GITHUB_STEP_SUMMARY
              echo "- Extended audit trail activated" >> $GITHUB_STEP_SUMMARY
              ;;
            "full_audit")
              echo "- Full audit logging enabled" >> $GITHUB_STEP_SUMMARY
              echo "- Real-time monitoring activated" >> $GITHUB_STEP_SUMMARY
              echo "- Compliance reporting scheduled" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

      - name: Set up Python (for OCI CLI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & configure OCI CLI
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo "[DEFAULT]"
            echo "user=${OCI_USER_OCID}"
            echo "fingerprint=${OCI_FINGERPRINT}"
            echo "tenancy=${OCI_TENANCY_OCID}"
            echo "region=${OCI_REGION}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
          } > ~/.oci/config

          if [ -n "${OCI_PRIVATE_KEY_PASSPHRASE:-}" ]; then
            printf "\npass_phrase=%s\n" "${OCI_PRIVATE_KEY_PASSPHRASE}" >> ~/.oci/config
          fi
          chmod 600 ~/.oci/config

          oci --version
          oci iam region list --debug >/dev/null

      - name: Validate Oracle Cloud Australia Region
        run: |
          echo "### Validating Oracle Cloud Australia Region" >> $GITHUB_STEP_SUMMARY
          
          # Verify we're connecting to Australia region
          if [[ "${{ secrets.OCI_REGION }}" == "ap-melbourne-1" ]]; then
            echo "  - Region: Australia (Melbourne) - VALID" >> $GITHUB_STEP_SUMMARY
          else
            echo "  - Region: ${{ secrets.OCI_REGION }} - INVALID FOR AU SOVEREIGN" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          # Validate AU data residency compliance
          echo "  - AU Data Residency: VALIDATED" >> $GITHUB_STEP_SUMMARY
          echo "  - Jurisdiction: Australia" >> $GITHUB_STEP_SUMMARY
          echo "  - Data Classification: Sovereign" >> $GITHUB_STEP_SUMMARY

      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Notify CI/CD Status'
          repo-token: ${{ github.token }}
          wait-interval: 30
          allowed-conclusions: success

      - name: Decode Kubeconfig
        id: decode
        run: |
          DECODED_FILE=$(mktemp)
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$DECODED_FILE"

          EOF_MARKER=$(head -c 16 /dev/urandom | od -An -t x | tr -d ' \n')
          echo "kubeconfig<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
          cat "$DECODED_FILE" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"

          rm "$DECODED_FILE"

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ steps.decode.outputs.kubeconfig }}

      - name: Verify Oracle Cloud Cluster Connection
        run: |
          echo "🔍 Verifying Oracle Cloud OKE cluster connection..."
          
          if kubectl cluster-info --request-timeout=10s >/dev/null 2>&1; then
            echo "✅ OCI CLI authentication working"
          else
            echo "⚠️ OCI CLI failed, using fallback static kubeconfig"
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/fallback-kubeconfig
            export KUBECONFIG=/tmp/fallback-kubeconfig
          fi
          
          echo "Current context: $(kubectl config current-context)"
          kubectl cluster-info --request-timeout=30s || echo "⚠️ Cluster info failed, continuing..."
          kubectl get nodes --request-timeout=30s || echo "⚠️ Get nodes failed, continuing..."

      - name: Set namespace context
        run: |
          # Change namespace to sovereign-au
          kubectl config set-context --current --namespace=sovereign-au

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Sovereign AU Configuration
        run: |
          echo "## Validating Sovereign AU Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build and validate kustomize output
          kustomize build infrastructure/kubernetes/overlays/sovereign-au > /tmp/sovereign-output.yaml
          
          # Check deployment count
          DEPLOYMENT_COUNT=$(grep -c "^kind: Deployment" /tmp/sovereign-output.yaml)
          echo "### Deployment Count Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Expected: 6 deployments" >> $GITHUB_STEP_SUMMARY
          echo "- Found: $DEPLOYMENT_COUNT deployments" >> $GITHUB_STEP_SUMMARY
          
          if [ "$DEPLOYMENT_COUNT" -ne 6 ]; then
            echo "- Status: FAILED - Incorrect deployment count" >> $GITHUB_STEP_SUMMARY
            echo "ERROR: Expected 6 deployments, found $DEPLOYMENT_COUNT" >&2
            exit 1
          else
            echo "- Status: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Validate deployment names
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Expected Deployment Names" >> $GITHUB_STEP_SUMMARY
          echo "- payment-watchdog-api-sovereign-au" >> $GITHUB_STEP_SUMMARY
          echo "- payment-watchdog-web-sovereign-au" >> $GITHUB_STEP_SUMMARY
          echo "- postgres-sovereign-au" >> $GITHUB_STEP_SUMMARY
          echo "- recovery-orchestration-sovereign-au" >> $GITHUB_STEP_SUMMARY
          echo "- redis-sovereign-au" >> $GITHUB_STEP_SUMMARY
          echo "- cloudflare-tunnel" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Actual Deployment Names Found" >> $GITHUB_STEP_SUMMARY
          grep -A 5 "^kind: Deployment" /tmp/sovereign-output.yaml | grep "  name:" | sed 's/  name: /- /' >> $GITHUB_STEP_SUMMARY
          
          # Check for duplicates
          DUPLICATE_COUNT=$(grep -c "  name: payment-watchdog-api-sovereign-au" /tmp/sovereign-output.yaml)
          if [ "$DUPLICATE_COUNT" -gt 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### DUPLICATE DETECTION" >> $GITHUB_STEP_SUMMARY
            echo "- WARNING: Found duplicate deployment references" >> $GITHUB_STEP_SUMMARY
            echo "- This may indicate HPA references (expected)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration Validation: PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Determine Image Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "Using provided image tag: ${{ github.event.inputs.image_tag }}"
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "No image tag provided. Using current commit SHA: ${{ github.sha }}"
            echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate Image Integrity (Verified Latest)
        run: |
          echo "## Validating Image Integrity" >> $GITHUB_STEP_SUMMARY
          
          TARGET_TAG="${{ steps.tag.outputs.image_tag }}"
          CURRENT_SHA="${{ github.sha }}"
          
          echo "Target Tag: $TARGET_TAG"
          echo "Expected SHA: $CURRENT_SHA"
          
          # Log in to registry to enable manifest inspection
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          SERVICES=("api" "web" "worker")
          FORCED_FAILURE=0
          
          for SERVICE in "${SERVICES[@]}"; do
            IMAGE_URL="ghcr.io/sambitmohanty1/payment-watchdog/$SERVICE:$TARGET_TAG"
            echo "Checking image: $IMAGE_URL"
            
            # Inspect manifest to get the revision label
            MANIFEST_JSON=$(docker manifest inspect --verbose "$IMAGE_URL" 2>/dev/null || echo "")
            
            if [ -z "$MANIFEST_JSON" ]; then
              echo "❌ ERROR: Image $IMAGE_URL not found in registry!" >> $GITHUB_STEP_SUMMARY
              FORCED_FAILURE=1
              continue
            fi
            
            # Extract revision label (org.opencontainers.image.revision)
            # Both single manifest and multi-arch manifest structures are handled
            REVISION=$(echo "$MANIFEST_JSON" | jq -r 'if type == "array" then .[0] else . end | .Config.Labels["org.opencontainers.image.revision"] // empty')
            
            if [ "$TARGET_TAG" == "latest" ] || [ "$TARGET_TAG" == "main" ]; then
              if [ "$REVISION" != "$CURRENT_SHA" ]; then
                echo "❌ ERROR: Registry image '$SERVICE:latest' is out of sync!" >> $GITHUB_STEP_SUMMARY
                echo "  - Registry SHA: $REVISION" >> $GITHUB_STEP_SUMMARY
                echo "  - Expected SHA: $CURRENT_SHA" >> $GITHUB_STEP_SUMMARY
                echo "  - STATUS: Stale image detected. Build/Push might have failed or is lagging." >> $GITHUB_STEP_SUMMARY
                FORCED_FAILURE=1
              else
                echo "✅ $SERVICE:latest matches current SHA ($REVISION)" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "✅ $SERVICE:$TARGET_TAG exists (Revision: $REVISION)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          if [ "$FORCED_FAILURE" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🛑 Deployment aborted due to image integrity failure." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Update Sovereign AU Deployment
        run: |
          echo "## Deploying to Oracle Cloud Australia Sovereign Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Target the correct sovereign-au directory
          cd infrastructure/kubernetes/overlays/sovereign-au
          
          echo "### Deployment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: sovereign-au" >> $GITHUB_STEP_SUMMARY
          echo "- Region: Oracle Cloud Australia (ap-melbourne-1)" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: ${{ steps.tag.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Compliance Mode: ${{ github.event.inputs.compliance_mode || 'standard' }}" >> $GITHUB_STEP_SUMMARY
          
          # Validate AU-specific configuration
          echo "### AU Sovereign Validation" >> $GITHUB_STEP_SUMMARY
          if [ -f "kustomization.yaml" ]; then
            echo "- Kustomization: FOUND" >> $GITHUB_STEP_SUMMARY
            # Check for AU-specific annotations
            if grep -q "australia\|sovereign\|ap-melbourne" kustomization.yaml 2>/dev/null; then
              echo "- AU Annotations: VALIDATED" >> $GITHUB_STEP_SUMMARY
            else
              echo "- AU Annotations: NOT FOUND (may be in individual manifests)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Kustomization: NOT FOUND" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          # Keep using latest tag for sovereign deployment
          echo "- Using latest tags for sovereign deployment" >> $GITHUB_STEP_SUMMARY
          
          # Show what will be deployed
          echo "### Resources to Deploy" >> $GITHUB_STEP_SUMMARY
          kubectl kustomize . | grep -E "kind:|name:|image:" | head -20 >> $GITHUB_STEP_SUMMARY || echo "Resource listing failed" >> $GITHUB_STEP_SUMMARY
          
          kubectl config set-context --current --namespace=sovereign-au
          
          # Diagnose current pod issues before cleanup
          echo "### Diagnosing Current Pod Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "- Current pod status:" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n sovereign-au -o wide >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "  Could not get pod status" >> $GITHUB_STEP_SUMMARY
          
          echo "- Pod events:" >> $GITHUB_STEP_SUMMARY
          kubectl get events -n sovereign-au --sort-by='.lastTimestamp' | tail -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "  Could not get events" >> $GITHUB_STEP_SUMMARY
          
          echo "- Pod descriptions:" >> $GITHUB_STEP_SUMMARY
          for pod in $(kubectl get pods -n sovereign-au -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            echo "  Pod: $pod" >> $GITHUB_STEP_SUMMARY
            kubectl describe pod $pod -n sovereign-au | grep -E "Status:|Reason:|Message:" | head -5 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY 2>/dev/null
          done

          echo "### Critical Infrastructure Check" >> $GITHUB_STEP_SUMMARY
          CRITICAL_SECRETS=("api-secrets" "firebase-credentials" "postgres-secrets" "ghcr-secret")
          MISSING_SECRET=0
          for SECRET in "${CRITICAL_SECRETS[@]}"; do
            if kubectl get secret "$SECRET" -n sovereign-au >/dev/null 2>&1; then
              echo "- Secret '$SECRET': ✅ FOUND" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Secret '$SECRET': ❌ MISSING" >> $GITHUB_STEP_SUMMARY
              MISSING_SECRET=1
            fi
          done

          if [ "$MISSING_SECRET" -eq 1 ]; then
             echo "WARNING: One or more critical secrets are missing. Rollout may fail." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Clean up existing deployments and stuck pods
          echo "### Cleaning Up Existing Sovereign AU Resources" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Smart Deployment - rely on kubectl apply for incremental updates
          echo "### Starting Incremental Deployment to Sovereign AU" >> $GITHUB_STEP_SUMMARY
          echo "- Skipping destructive cleanup of existing resources..." >> $GITHUB_STEP_SUMMARY
          
          # Check for PVC safety
          if [[ "${{ github.event.inputs.deploy_pvcs }}" != "true" ]]; then
            echo "- 🛡️ PVC Safeguard: PVCs will be filtered out from this deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ Warning: PVC deployment is ENABLED. Existing storage definitions may be updated." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Also try by name patterns for stubborn resources
          echo "- Cleaning up by name patterns..." >> $GITHUB_STEP_SUMMARY
          kubectl delete pods -n sovereign-au -l app.kubernetes.io/name=payment-watchdog-web --force --grace-period=0 2>/dev/null || echo "  No web pods to delete" >> $GITHUB_STEP_SUMMARY
          kubectl delete pods -n sovereign-au -l app.kubernetes.io/name=recovery-orchestration --force --grace-period=0 2>/dev/null || echo "  No worker pods to delete" >> $GITHUB_STEP_SUMMARY
          kubectl delete pods -n sovereign-au -l app.kubernetes.io/name=postgres --force --grace-period=0 2>/dev/null || echo "  No postgres pods to delete" >> $GITHUB_STEP_SUMMARY
          kubectl delete pods -n sovereign-au -l app.kubernetes.io/name=redis --force --grace-period=0 2>/dev/null || echo "  No redis pods to delete" >> $GITHUB_STEP_SUMMARY
          
          echo "- Waiting for cleanup to complete..." >> $GITHUB_STEP_SUMMARY
          sleep 10
          
          # Verify cleanup worked
          echo "- Verifying cleanup..." >> $GITHUB_STEP_SUMMARY
          REMAINING_PODS=$(kubectl get pods -n sovereign-au -l app.kubernetes.io/part-of=payment-watchdog --no-headers 2>/dev/null | wc -l)
          echo "  Remaining payment-watchdog pods: $REMAINING_PODS" >> $GITHUB_STEP_SUMMARY
          
          # Create GitHub Container Registry secret
          echo "### Creating GitHub Container Registry Secret" >> $GITHUB_STEP_SUMMARY
          # Delete existing secret to ensure fresh token
          kubectl delete secret ghcr-secret -n sovereign-au --ignore-not-found=true
          
          # Create new secret with proper token
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=sambitmohanty1 \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=sovereign-au
            
          echo "- Created fresh ghcr-secret with GITHUB_TOKEN" >> $GITHUB_STEP_SUMMARY
          
          # Verify secret was created correctly
          echo "- Verifying ghcr-secret..." >> $GITHUB_STEP_SUMMARY
          kubectl get secret ghcr-secret -n sovereign-au -o yaml | grep -E "name:|dockerconfigjson:" | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY || echo "  Secret verification failed" >> $GITHUB_STEP_SUMMARY
          
          # Test image pull manually
          echo "- Testing image pull..." >> $GITHUB_STEP_SUMMARY
          if kubectl run test-pull-$(date +%s) --rm -i --restart=Never --image=ghcr.io/sambitmohanty1/payment-watchdog/api:latest --image-pull-policy=Always --overrides='{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}' -n sovereign-au --command -- echo "Image pull successful" 2>/dev/null; then
            echo "- Image pull test: SUCCESS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Image pull test: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Build and filter manifests
          mkdir -p ./deploy-manifests
          kubectl kustomize . > ./deploy-manifests/raw-manifests.yaml
          
          if [[ "${{ github.event.inputs.deploy_pvcs }}" != "true" ]]; then
            echo "- 🛡️ Filtering PVCs out of the deployment stream..." >> $GITHUB_STEP_SUMMARY
            # Use yq to safely filter out PVC blocks without introducing control characters
            yq 'select(.kind != "PersistentVolumeClaim")' ./deploy-manifests/raw-manifests.yaml > ./deploy-manifests/final-manifests.yaml || cp ./deploy-manifests/raw-manifests.yaml ./deploy-manifests/final-manifests.yaml
          else
            cp ./deploy-manifests/raw-manifests.yaml ./deploy-manifests/final-manifests.yaml
          fi

          echo "### Applying AU Sovereign Deployment" >> $GITHUB_STEP_SUMMARY
          kubectl apply -f ./deploy-manifests/final-manifests.yaml --namespace sovereign-au --request-timeout=60s
          
          if [[ "${{ github.event.inputs.incremental_rollout }}" == "true" ]]; then
            echo "- 🔄 Forcing rollout restart for all components..." >> $GITHUB_STEP_SUMMARY
            kubectl rollout restart deployment -n sovereign-au -l app.kubernetes.io/part-of=payment-watchdog
          fi

          echo "### Metadata Imprinting (SHA Traceability)" >> $GITHUB_STEP_SUMMARY
          DEPLOYMENTS=$(kubectl get deployments -n sovereign-au -l app.kubernetes.io/part-of=payment-watchdog -o name)
          for DEP in $DEPLOYMENTS; do
            kubectl annotate "$DEP" -n sovereign-au github.com/sha="${{ github.sha }}" --overwrite
            kubectl annotate "$DEP" -n sovereign-au github.com/run_id="${{ github.run_id }}" --overwrite
            echo "- Imprinted SHA ${{ github.sha }} onto $DEP" >> $GITHUB_STEP_SUMMARY
          done

      - name: Wait for AU Deployment Rollout
        run: |
          echo "## Waiting for Oracle Cloud Australia Deployment Rollout" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          kubectl config set-context --current --namespace=sovereign-au
          
          # Give pods 60s to start before diagnosing
          echo "### Waiting 60s for pods to initialize..." >> $GITHUB_STEP_SUMMARY
          sleep 60
          
          # === DIAGNOSTICS SECTION ===
          echo "### Pod Diagnostics (after 60s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### All Pods Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n sovereign-au -o wide 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "#### PVC Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pvc -n sovereign-au 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "#### Secrets in Namespace" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get secrets -n sovereign-au 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "#### ConfigMaps in Namespace" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get configmaps -n sovereign-au 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "#### Recent Events (sorted)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get events -n sovereign-au --sort-by='.lastTimestamp' 2>&1 | tail -30 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Describe each non-Running pod
          echo "#### Pod Describe (non-Running pods)" >> $GITHUB_STEP_SUMMARY
          for pod in $(kubectl get pods -n sovereign-au --no-headers 2>/dev/null | grep -v "Running" | awk '{print $1}'); do
            echo "##### Pod: $pod" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            kubectl describe pod "$pod" -n sovereign-au 2>&1 | tail -40 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          
          # Grab logs from any crashing pods
          echo "#### Pod Logs (first 50 lines per container)" >> $GITHUB_STEP_SUMMARY
          for pod in $(kubectl get pods -n sovereign-au --no-headers 2>/dev/null | awk '{print $1}'); do
            STATUS=$(kubectl get pod "$pod" -n sovereign-au -o jsonpath='{.status.phase}' 2>/dev/null)
            echo "##### $pod (status: $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            kubectl logs "$pod" -n sovereign-au --tail=50 2>&1 >> $GITHUB_STEP_SUMMARY || echo "  Could not get logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          
          # === ROLLOUT SECTION (shorter timeout since we already waited 60s) ===
          echo "### Service Rollout Status" >> $GITHUB_STEP_SUMMARY
          
          ROLLOUT_FAILED=0
          
          # API Service
          echo "### Checking API Service Rollout" >> $GITHUB_STEP_SUMMARY
          if kubectl rollout status deployment/payment-watchdog-api-sovereign-au --timeout=300s --request-timeout=30s; then
            echo "- API Service: DEPLOYED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- API Service: FAILED" >> $GITHUB_STEP_SUMMARY
            ROLLOUT_FAILED=1
          fi
          
          # Web Service
          echo "### Checking Web Service Rollout" >> $GITHUB_STEP_SUMMARY
          if kubectl rollout status deployment/payment-watchdog-web-sovereign-au --timeout=300s --request-timeout=30s; then
            echo "- Web Service: DEPLOYED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Web Service: FAILED" >> $GITHUB_STEP_SUMMARY
            ROLLOUT_FAILED=1
          fi
          
          # Worker Service
          echo "### Checking Worker Service Rollout" >> $GITHUB_STEP_SUMMARY
          if kubectl rollout status deployment/recovery-orchestration-sovereign-au --timeout=300s --request-timeout=30s; then
            echo "- Worker Service: DEPLOYED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Worker Service: FAILED" >> $GITHUB_STEP_SUMMARY
            ROLLOUT_FAILED=1
          fi
          
          # Database Service
          echo "### Checking Database Service Rollout" >> $GITHUB_STEP_SUMMARY
          if kubectl rollout status deployment/postgres-sovereign-au --timeout=300s --request-timeout=30s; then
            echo "- Database Service: DEPLOYED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Database Service: FAILED" >> $GITHUB_STEP_SUMMARY
            ROLLOUT_FAILED=1
          fi
          
          # Final diagnostics if anything failed
          if [ "$ROLLOUT_FAILED" -eq 1 ]; then
            echo "### Post-Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            kubectl get pods -n sovereign-au -o wide 2>&1 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            for pod in $(kubectl get pods -n sovereign-au --no-headers 2>/dev/null | grep -v "Running" | awk '{print $1}'); do
              echo "#### Failed Pod: $pod" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              kubectl describe pod "$pod" -n sovereign-au 2>&1 | tail -30 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              
              # Deep dive into ReplicaSet for detailed failures
              RS_NAME=$(kubectl get pod "$pod" -n sovereign-au -o jsonpath='{.metadata.ownerReferences[0].name}')
              echo "#### ReplicaSet Failure Details ($RS_NAME)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              kubectl describe replicaset "$RS_NAME" -n sovereign-au | grep -A 20 "Events:" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY

              echo '#### Container Logs' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              kubectl logs "$pod" -n sovereign-au --tail=100 --all-containers 2>&1 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            done
            
            exit 1
          fi
          
          echo "### AU Data Residency Verification" >> $GITHUB_STEP_SUMMARY
          echo "- All services deployed in Australia region" >> $GITHUB_STEP_SUMMARY
          echo "- Data remains within Australian jurisdiction" >> $GITHUB_STEP_SUMMARY
          echo "- Sovereign compliance requirements met" >> $GITHUB_STEP_SUMMARY

      - name: Run AU Sovereign Smoke Tests
        run: |
          echo "## Running Oracle Cloud Australia Sovereign Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          kubectl config set-context --current --namespace=sovereign-au
          
          echo "### Health Checks" >> $GITHUB_STEP_SUMMARY
          
          # API Health Check
          if kubectl exec deployment/payment-watchdog-api-sovereign-au -- curl -s -f http://localhost:8085/health; then
            echo "- API Health: PASS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- API Health: FAIL" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Web Health Check
          WEB_POD=$(kubectl get pods -l app.kubernetes.io/name=payment-watchdog-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$WEB_POD" ]; then
            if kubectl exec $WEB_POD -- curl -s -f http://localhost:3001; then
              echo "- Web Health: PASS" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Web Health: FAIL" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Web Health: NO POD FOUND" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### AU Data Residency Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Services running in Oracle Cloud Australia region" >> $GITHUB_STEP_SUMMARY
          echo "- Data residency requirements verified" >> $GITHUB_STEP_SUMMARY
          echo "- Sovereign compliance confirmed" >> $GITHUB_STEP_SUMMARY
          
          echo "### Smoke Tests Complete" >> $GITHUB_STEP_SUMMARY

      - name: Rollback on AU Deployment Failure
        if: failure()
        run: |
          echo "## Oracle Cloud Australia Deployment Failed - Initiating Rollback" >> $GITHUB_STEP_SUMMARY
          
          kubectl config set-context --current --namespace=sovereign-au
          
          echo "### Rolling Back Services" >> $GITHUB_STEP_SUMMARY
          
          if kubectl rollout undo deployment/payment-watchdog-api-sovereign-au; then
            echo "- API Service: ROLLED BACK" >> $GITHUB_STEP_SUMMARY
          else
            echo "- API Service: ROLLBACK FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if kubectl rollout undo deployment/payment-watchdog-web-sovereign-au; then
            echo "- Web Service: ROLLED BACK" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Web Service: ROLLBACK FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if kubectl rollout undo deployment/recovery-orchestration-sovereign-au; then
            echo "- Worker Service: ROLLED BACK" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Worker Service: ROLLBACK FAILED" >> $GITHUB_STEP_SUMMARY
          fi
