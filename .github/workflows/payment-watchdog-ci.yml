name: Payment Watchdog CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag (e.g., v1.0.0, latest). If not provided, uses commit SHA.'
        required: false
        type: string
      build_reason:
        description: 'Reason for manual build (e.g., hotfix, release)'
        required: false
        type: string

# 🛑 SECURITY: Restrict permissions for GITHUB_TOKEN
permissions:
  contents: read
  security-events: write # Required for Trivy/CodeQL
  packages: write

# Ensure only single build runs per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  # IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/payment-watchdog

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true # Native caching enabled
          cache-dependency-path: "**/*.sum"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd ../api && go mod download
          cd ../worker && go mod download

      - name: Run API unit tests
        run: |
          cd api
          go test -v -race -coverprofile=coverage-api.out ./...

