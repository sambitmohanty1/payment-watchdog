  # Quick Security Check (Lightweight)
  quick-security:
    name: Quick Security Check
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: .
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lightweight CodeQL scan (Go only)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # Quick dependency check
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Quick vulnerability check
        run: |
          cd api && go list -json -m all | nancy sleuth --quiet || true
          cd ../worker && go list -json -m all | nancy sleuth --quiet || true

  # Build and Push Images (Parallel)
  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [unit-tests, quick-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [api, web, worker]
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile.production
            image: ghcr.io/${{ github.repository }}/api
          - service: web
            context: web
            dockerfile: web/Dockerfile.production
            image: ghcr.io/${{ github.repository }}/web
          - service: worker
            context: .
            dockerfile: worker/Dockerfile.production
            image: ghcr.io/${{ github.repository }}/worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ github.event.inputs.image_tag && format('type=raw,value={0}', github.event.inputs.image_tag) || '' }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

