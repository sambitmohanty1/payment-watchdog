name: Payment Watchdog CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 🛑 SECURITY: Restrict permissions for GITHUB_TOKEN
permissions:
  contents: read
  security-events: write # Required for Trivy/CodeQL
  packages: write

# Ensure only single build runs per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

