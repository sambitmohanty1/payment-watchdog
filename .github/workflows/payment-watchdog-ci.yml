  # Phase 1 Security Scanning
  security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    name: Phase 1 Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # GitHub CodeQL SAST
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: go, javascript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      # OWASP Dependency Check
      - name: Set up Java (Dependency Check requires Java)
        uses: actions/setup-java@v3
        if: false
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'payment-watchdog'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-reports'

      - name: Upload Dependency Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-reports/
          retention-days: 30

      # Trivy Security Scanning
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy fs results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      # Build Docker images for container scanning
      - name: Build Docker images for scanning
        run: |
          docker build -t payment-watchdog-api:scan ./api
          docker build -t payment-watchdog-worker:scan ./worker
          docker build -t payment-watchdog-web:scan ./web

      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'payment-watchdog-api:scan'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Worker image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'payment-watchdog-worker:scan'
          format: 'sarif'
          output: 'trivy-worker-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Web image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'payment-watchdog-web:scan'
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy container results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'trivy-api'

      # Go-specific security scanning
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec on API
        run: |
          cd api
          gosec -fmt sarif -out gosec-api-results.sarif ./... || true

      - name: Run Gosec on Worker
        run: |
          cd worker
          gosec -fmt sarif -out gosec-worker-results.sarif ./... || true

      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'api/gosec-api-results.sarif'
          category: 'gosec-api'

      # Node.js security scanning
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci

      - name: Run npm audit
        run: |
          cd web
          npm audit --audit-level=high --json > npm-audit-results.json || true

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: web/npm-audit-results.json
          retention-days: 30

      # Security Summary
      - name: Generate Security Summary
        run: |
          echo "# 🛡️ Payment Watchdog Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Security Scans Completed" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL SAST: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- OWASP Dependency Check: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Security Scan: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Go Security Analysis: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Security Audit: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Security Tab: See detailed SARIF findings" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: Download detailed reports from Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚨 Security Gates" >> $GITHUB_STEP_SUMMARY
          echo "- Critical vulnerabilities: Block deployment" >> $GITHUB_STEP_SUMMARY
          echo "- High vulnerabilities: Review required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Payment Watchdog Phase 1 Security Scan*" >> $GITHUB_STEP_SUMMARY

  # Build and Push Images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}-api
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}-web
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.payment-watchdog.example.com  # Update with your actual staging URL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# ADD THIS AUTHENTICATION STEP ---
      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      # SECURE: Handles Kubeconfig securely with proper decoding
      - name: Set k8s context
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Get available contexts and use the first one if no current context
          CURRENT_CONTEXT=$(kubectl config current-context 2>/dev/null || echo "")
          if [ -z "$CURRENT_CONTEXT" ]; then
            AVAILABLE_CONTEXT=$(kubectl config get-contexts -o name | head -1)
            kubectl config use-context "$AVAILABLE_CONTEXT"
          fi
          
          kubectl config set-context --current --namespace=staging
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Update staging deployment
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          cd api/deployments/kubernetes
          
          # Update image tags in kustomization
          IMAGE_TAG=${{ github.sha }}
          
          # Update API image
          sed -i "s|newName: ghcr.io/sambitmohanty1/payment-watchdog/api|newName: ghcr.io/sambitmohanty1/payment-watchdog/api|g" apps/payment-watchdog-api/kustomization.yaml
          sed -i "s|newTag: latest|newTag: ${IMAGE_TAG}|g" apps/payment-watchdog-api/kustomization.yaml
          
          # Update Web image
          sed -i "s|newName: ghcr.io/sambitmohanty1/payment-watchdog/web|newName: ghcr.io/sambitmohanty1/payment-watchdog/web|g" apps/payment-watchdog-web/kustomization.yaml
          sed -i "s|newTag: latest|newTag: ${IMAGE_TAG}|g" apps/payment-watchdog-web/kustomization.yaml
          
          # Update Worker image (recovery-orchestration)
          sed -i "s|newName: ghcr.io/sambitmohanty1/payment-watchdog/worker|newName: ghcr.io/sambitmohanty1/payment-watchdog/worker|g" apps/recovery-orchestration/kustomization.yaml
          sed -i "s|newTag: latest|newTag: ${IMAGE_TAG}|g" apps/recovery-orchestration/kustomization.yaml
          
          # Deploy to staging namespace
          kubectl config set-context --current --namespace=staging
          kubectl apply -k .

      - name: Wait for rollout
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          kubectl rollout status deployment/payment-watchdog-api --timeout=300s
          kubectl rollout status deployment/payment-watchdog-ui --timeout=300s
          kubectl rollout status deployment/recovery-orchestration --timeout=300s

      - name: Run smoke tests
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          # Wait for services to be ready
          sleep 30

          # Test API health
          kubectl exec deployment/payment-watchdog-api -- curl -f http://localhost:8080/health

          # Test web accessibility
          WEB_POD=$(kubectl get pods -l app=payment-watchdog,component=ui -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $WEB_POD -- curl -f http://localhost:3000

          # Test worker service
          WORKER_POD=$(kubectl get pods -l app.kubernetes.io/name=recovery-orchestration -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $WORKER_POD -- ps aux | grep payment-watchdog-worker
