  # Phase 1 Security Scanning
  security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    name: Phase 1 Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub CodeQL SAST
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go, javascript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # Trivy Security Scanning
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Ensure Trivy fs SARIF exists
        if: always()
        run: if [ ! -f trivy-fs-results.sarif ]; then echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Security Scanner","rules":[]}},"results":[]}]}' > trivy-fs-results.sarif; fi

      - name: Upload Trivy fs results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      # Build Docker images for container scanning
      - name: Build Docker images for scanning
        run: |
          docker build -t payment-watchdog-api:scan ./api
          docker build -t payment-watchdog-worker:scan ./worker
          docker build -t payment-watchdog-web:scan ./web

      - name: Run Trivy on API image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'payment-watchdog-api:scan'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Ensure Trivy API SARIF exists
        if: always()
        run: if [ ! -f trivy-api-results.sarif ]; then echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Security Scanner","rules":[]}},"results":[]}]}' > trivy-api-results.sarif; fi

      - name: Run Trivy on Worker image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'payment-watchdog-worker:scan'
          format: 'sarif'
          output: 'trivy-worker-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on Web image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'payment-watchdog-web:scan'
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Ensure Trivy Web SARIF exists
        if: always()
        run: if [ ! -f trivy-web-results.sarif ]; then echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Security Scanner","rules":[]}},"results":[]}]}' > trivy-web-results.sarif; fi

      - name: Ensure Trivy Worker SARIF exists
        if: always()
        run: if [ ! -f trivy-worker-results.sarif ]; then echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Security Scanner","rules":[]}},"results":[]}]}' > trivy-worker-results.sarif; fi

      - name: Upload Trivy API results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'trivy-api'

      - name: Upload Trivy Worker results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-worker-results.sarif'
          category: 'trivy-worker'

      - name: Upload Trivy Web results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'trivy-web'

      # Go-specific security scanning
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Install Gosec
        env:
          GOPROXY: "https://proxy.golang.org,direct"
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec on API
        run: |
          cd api
          gosec -fmt sarif -out gosec-api-results.sarif ./... || true

      - name: Ensure Gosec SARIF exists
        if: always()
        run: if [ ! -f api/gosec-api-results.sarif ]; then echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Security Scanner","rules":[]}},"results":[]}]}' > api/gosec-api-results.sarif; fi

      - name: Run Gosec on Worker
        run: |
          cd worker
          gosec -fmt sarif -out gosec-worker-results.sarif ./... || true

      - name: Ensure Gosec Worker SARIF exists
        if: always()
        run: if [ ! -f worker/gosec-worker-results.sarif ]; then echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Security Scanner","rules":[]}},"results":[]}]}' > worker/gosec-worker-results.sarif; fi

      - name: Upload API Gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'api/gosec-api-results.sarif'
          category: 'gosec-api'

      - name: Upload Worker Gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'worker/gosec-worker-results.sarif'
          category: 'gosec-worker'

      # Node.js security scanning
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci

      - name: Run npm audit
        run: |
          cd web
          npm audit --audit-level=high --json > npm-audit-results.json || true

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: web/npm-audit-results.json
          retention-days: 30

      # Security Summary
      - name: Generate Security Summary
        run: |
          echo "# 🛡️ Payment Watchdog Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Security Scans Completed" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL SAST: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Security Scan: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Go Security Analysis: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Security Audit: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Results" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Security Tab: See detailed SARIF findings" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: Download detailed reports from Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚨 Security Gates" >> $GITHUB_STEP_SUMMARY
          echo "- Critical vulnerabilities: Block deployment" >> $GITHUB_STEP_SUMMARY
          echo "- High vulnerabilities: Review required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Payment Watchdog Phase 1 Security Scan*" >> $GITHUB_STEP_SUMMARY

  # Build and Push Images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile.production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile.production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.production
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual Production Deployment
  deploy-production-manual:
    name: Deploy to Production (Manual)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://payment-watchdog.example.com  # Update with your actual production URL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ steps.decode.outputs.kubeconfig }}
      
      - name: Set namespace context
        run: |
          kubectl config set-context --current --namespace=production
      
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
      
      - name: Update production deployment
        run: |
          cd api/deployments/kubernetes
          
          # Update image tags using kustomize
          IMAGE_TAG=${{ github.sha }}
          
          cd apps/payment-watchdog-api
          kustomize edit set image payment-watchdog-api=ghcr.io/${{ github.repository }}/api:${IMAGE_TAG}
          
          cd ../..
          cd apps/payment-watchdog-web
          kustomize edit set image payment-watchdog-ui=ghcr.io/${{ github.repository }}/web:${IMAGE_TAG}
          
          cd ../..
          cd apps/recovery-orchestration
          kustomize edit set image payment-watchdog-recovery-orchestration=ghcr.io/${{ github.repository }}/worker:${IMAGE_TAG}
          
          cd ../..
          
          # Deploy to production namespace
          kubectl apply -k --validate=false .
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/payment-watchdog-api --timeout=300s
          kubectl rollout status deployment/payment-watchdog-ui --timeout=300s
          kubectl rollout status deployment/recovery-orchestration --timeout=300s
      
      - name: Run smoke tests
        run: |
          # Test API health
          kubectl exec deployment/payment-watchdog-api -- curl -s -f http://localhost:8080/health
          
          # Test web accessibility
          WEB_POD=$(kubectl get pods -l app=payment-watchdog,component=ui -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $WEB_POD -- curl -s -f http://localhost:3011
      
      - name: Rollback on failure
        if: failure()
        run: |
            echo "🚨 Deployment failed - initiating rollback"
            kubectl rollout undo deployment/payment-watchdog-api
            kubectl rollout undo deployment/payment-watchdog-ui
            kubectl rollout undo deployment/recovery-orchestration
      
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.payment-watchdog.example.com  # Update with your actual staging URL

  
