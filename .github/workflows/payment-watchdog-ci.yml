        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd ../api && go mod download
          cd ../worker && go mod download

      - name: Run API unit tests
