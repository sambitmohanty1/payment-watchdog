server:
  port: "8085"
  host: "0.0.0.0"
  https: false

database:
  host: "postgres-sovereign-au.sovereign-au.svc.cluster.local"
  port: 5432
  name: "payment_watchdog"
  user: "postgres"
  password: ""  # Set via DATABASE_PASSWORD env var
  ssl_mode: "require"

stripe:
  secret_key: ""       # Set via STRIPE_SECRET_KEY env var
  webhook_secret: ""   # Set via STRIPE_WEBHOOK_SECRET env var
  publishable_key: ""  # Set via STRIPE_PUBLISHABLE_KEY env var

xero:
  client_id: ""        # Set via XERO_CLIENT_ID env var
  client_secret: ""    # Set via XERO_CLIENT_SECRET env var
  redirect_uri: ""     # Set via XERO_REDIRECT_URI env var (e.g. https://api.yourdomain.com/xero/oauth/callback)

email:
  provider: "smtp"
  host: "localhost"
  port: 587
  username: ""  # Set via EMAIL_USERNAME env var
  password: ""  # Set via EMAIL_PASSWORD env var
  from_email: "noreply@payment-watchdog.com"
  from_name: "Payment Watchdog"

log:
  level: "info"

firebase:
  project_id: ""           # Set via FIREBASE_PROJECT_ID env var
  service_account_path: "" # Set via FIREBASE_SERVICE_ACCOUNT_PATH env var

cors:
  allowed_origins:
    - "http://152.69.179.49"   # OCI Web frontend
    - "http://localhost:3011"   # Local development

# Vault configuration for secure secret management
vault:
  url: ""    # Set to Vault server URL (e.g. "http://localhost:8200")
  token: "" # Set to Vault token for authentication
