apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - deployment.yaml
  - service.yaml
  - service-account.yaml
  - configmap.yaml
  - secret.yaml

labels:
  - pairs:
      app.kubernetes.io/name: payment-watchdog-api
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: payment-watchdog
      environment: staging
    includeSelectors: false
    includeTemplates: true

images:
  - name: payment-watchdog-api
    newName: ghcr.io/sambitmohanty1/payment-watchdog/api
    newTag: latest
