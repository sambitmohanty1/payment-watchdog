apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-watchdog-config
data:
  config.yaml: |
    server:
      port: 8085
      environment: production
      logLevel: info
      shutdownTimeout: 30s
    
    database:
      host: payment-watchdog-postgres.production.svc.cluster.local
      port: 5432
      name: payment_watchdog_production
      sslMode: require
      maxIdleConns: 20
      maxOpenConns: 200
      connMaxLifetime: 2h
      
    redis:
      addr: payment-watchdog-redis.production.svc.cluster.local:6379
      db: 0
      poolSize: 200
      
    providers:
      stripe:
        apiVersion: 2020-08-27
        timeout: 30s
      xero:
        apiVersion: 2.0
        timeout: 30s
        environment: production  # Production endpoints, not sandbox
      quickbooks:
        apiVersion: 6.0
        timeout: 30s
        environment: production  # Production endpoints, not sandbox
    
    notifications:
      email:
        enabled: true
        from: no-reply@payment-watchdog.com
        retryAttempts: 3
      sms:
        enabled: true
        from: PAYWATCH
        retryAttempts: 3
    
    # Oracle Cloud specific settings
    oracle:
      region: ap-sydney-1
      compartment: PaymentWatchdogSovereign
      cluster: payment-watchdog-cluster
