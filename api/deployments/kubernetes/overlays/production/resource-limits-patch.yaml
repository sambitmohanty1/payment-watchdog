# Production resource limits for payment-watchdog services
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-api
spec:
  template:
    spec:
      containers:
      - name: app
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-ui
spec:
  template:
    spec:
      containers:
      - name: payment-watchdog-ui
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-orchestration
spec:
  template:
    spec:
      containers:
      - name: recovery-orchestration
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
