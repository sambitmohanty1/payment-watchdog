apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-api-sovereign-au
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-watchdog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-watchdog-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: payment-watchdog
        environment: staging
      annotations:
        prometheus.io/port: "8085"
        prometheus.io/scrape: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - payment-watchdog-api
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - name: app
        image: ghcr.io/sambitmohanty1/payment-watchdog/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
          name: http
        # livenessProbe:
        #   failureThreshold: 3
        #   httpGet:
        #     path: /health
        #     port: 8085
        #     scheme: HTTP
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   successThreshold: 1
        #   timeoutSeconds: 1
        # readinessProbe:
        #   failureThreshold: 3
        #   httpGet:
        #     path: /health
        #     port: 8085
        #     scheme: HTTP
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
        #   successThreshold: 1
        #   timeoutSeconds: 1
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: DATABASE_HOST
          value: lexure-postgres-sovereign-au.sovereign-au.svc.cluster.local
        - name: REDIS_URL
          value: redis://lexure-redis-sovereign-au.sovereign-au.svc.cluster.local:6379
        envFrom:
        - configMapRef:
            name: payment-watchdog-config-sovereign-au
        - secretRef:
            name: payment-watchdog-secrets-sovereign-au
        volumeMounts:
        - mountPath: /app/config
          name: config-volume
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 420
          name: payment-watchdog-config-sovereign-au
          optional: false
        name: config-volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-ui-sovereign-au
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-watchdog
      component: ui
  template:
    metadata:
      labels:
        app: payment-watchdog
        component: ui
        version: v1.0.0
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: payment-watchdog-ui
        image: ghcr.io/sambitmohanty1/payment-watchdog/web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 3001
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 3001
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3001"
        - name: NEXT_PUBLIC_API_URL
          value: http://payment-watchdog-mvp.lexure-mvp.svc.cluster.local
        - name: NEXT_PUBLIC_DEV_PROXY_BYPASS
          value: "true"
        - name: NEXT_PUBLIC_LOCALHOST_BYPASS
          value: "true"
        - name: NO_PROXY
          value: localhost,127.0.0.1,::1,payment-watchdog-mvp.lexure-mvp.svc.cluster.local
        - name: no_proxy
          value: localhost,127.0.0.1,::1,payment-watchdog-mvp.lexure-mvp.svc.cluster.local
        volumeMounts:
        - mountPath: /app/config
          name: config-volume
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 420
          name: payment-watchdog-ui-config-sovereign-au
        name: config-volume
---
