apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-watchdog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-watchdog-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: payment-watchdog
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64  # Fix: Changed from arm64 to match your OCI node
      containers:
      - name: app
        image: payment-watchdog-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
          name: http
        resources:
          requests:
            memory: "128Mi"        # Fix: Reduced to fit on a single node
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: DATABASE_HOST
          value: "lexure-postgres-sovereign-au.sovereign-au.svc.cluster.local" # Fix: Corrected for Sovereign AU namespace
        - name: REDIS_URL
          value: "redis://lexure-redis-sovereign-au.sovereign-au.svc.cluster.local:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-ui
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-watchdog-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-watchdog-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: payment-watchdog
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64  # Fix: Changed from arm64
      containers:
      - name: payment-watchdog-ui
        image: payment-watchdog-web:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-orchestration
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-orchestration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-orchestration
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: payment-watchdog
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64  # Fix: Changed from arm64
      containers:
      - name: recovery-orchestration
        image: payment-watchdog-recovery:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: DATABASE_HOST
          value: "lexure-postgres-sovereign-au.sovereign-au.svc.cluster.local" # Fix: Corrected for Sovereign AU namespace
        - name: REDIS_URL
          value: "redis://lexure-redis-sovereign-au.sovereign-au.svc.cluster.local:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: recovery-orchestration-secrets-sovereign-au
              key: REDIS_PASSWORD
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: recovery-orchestration-secrets-sovereign-au
              key: DATABASE_PASSWORD
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: recovery-orchestration-secrets-sovereign-au
              key: DATABASE_USER
