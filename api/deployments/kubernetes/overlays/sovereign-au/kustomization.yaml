apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/components/postgres
  - ../../base/components/redis
  # - ../../base/components/ingress
  # - ../../base/components/monitoring
  - ../../apps/payment-watchdog-api
  - ../../apps/payment-watchdog-web
  - ../../apps/recovery-orchestration
  
  # Local Prometheus monitoring stack
  - prometheus-config.yaml
  - prometheus-deployment.yaml
  - prometheus-rbac.yaml
  - prometheus-exporters.yaml

# Note: If this is strictly for the Sovereign environment, 
# ensure this is 'sovereign-au' instead of 'production'
namespace: sovereign-au
nameSuffix: "-sovereign-au"

commonLabels:
  app.kubernetes.io/part-of: payment-watchdog
  environment: sovereign-au

images:
  - name: ghcr.io/sambitmohanty1/payment-watchdog/api
    newTag: latest
  - name: ghcr.io/sambitmohanty1/payment-watchdog/web
    newTag: latest
  - name: ghcr.io/sambitmohanty1/payment-watchdog/worker
    newTag: latest

secretGenerator:
  - name: recovery-orchestration-secrets
    behavior: merge
    literals:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_PASSWORD=redis
      - JWT_SECRET=jwt_signing_key
      - STRIPE_API_KEY=stripe_key_placeholder
      - XERO_CLIENT_ID=xero_id_placeholder
      - XERO_CLIENT_SECRET=xero_secret_placeholder
      - QUICKBOOKS_CLIENT_ID=qb_id_placeholder
      - QUICKBOOKS_CLIENT_SECRET=qb_secret_placeholder

patches:
  # 1. File-based patches for Architecture, Resources, and Secrets
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
  
  # 2. Inline patches to fix Storage Classes for Oracle Cloud
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pv-claim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: oci-bv
  - target:
      kind: PersistentVolumeClaim
      name: redis-pv-claim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: oci-bv
