apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: sovereign-au
        cluster: payment-watchdog-sovereign

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: '/metrics'
        scrape_interval: 5s

      # Payment Watchdog API
      - job_name: 'payment-watchdog-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - sovereign-au
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: payment-watchdog-api-internal-sovereign-au
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - target_label: __address__
            replacement: payment-watchdog-api-internal-sovereign-au.sovereign-au.svc.cluster.local:8085
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Recovery Orchestration Worker
      - job_name: 'recovery-orchestration'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - sovereign-au
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: recovery-orchestration-internal-sovereign-au
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - target_label: __address__
            replacement: recovery-orchestration-internal-sovereign-au.sovereign-au.svc.cluster.local:8086
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # PostgreSQL Exporter
      - job_name: 'postgres-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - sovereign-au
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: postgres-exporter-sovereign-au
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Node Exporter
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - sovereign-au
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter-sovereign-au
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  alerting.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@payment-watchdog-sovereign.au'
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
        - match:
            severity: warning
          receiver: 'warning-alerts'

    receivers:
      - name: 'web.hook'
        webhook_configs:
          - url: 'http://payment-watchdog-api-internal-sovereign-au.sovereign-au.svc.cluster.local:8085/webhooks/alerts'
            send_resolved: true

      - name: 'critical-alerts'
        webhook_configs:
          - url: 'http://payment-watchdog-api-internal-sovereign-au.sovereign-au.svc.cluster.local:8085/webhooks/critical-alerts'
            send_resolved: true

      - name: 'warning-alerts'
        webhook_configs:
          - url: 'http://payment-watchdog-api-internal-sovereign-au.sovereign-au.svc.cluster.local:8085/webhooks/warning-alerts'
            send_resolved: true

  rules.yml: |
    groups:
      - name: payment-watchdog.rules
        rules:
          # API Health
          - alert: APIDown
            expr: up{job="payment-watchdog-api"} == 0
            for: 1m
            labels:
              severity: critical
              service: payment-watchdog-api
            annotations:
              summary: "Payment Watchdog API is down"
              description: "Payment Watchdog API has been down for more than 1 minute."

          # Worker Health
          - alert: WorkerDown
            expr: up{job="recovery-orchestration"} == 0
            for: 2m
            labels:
              severity: critical
              service: recovery-orchestration
            annotations:
              summary: "Recovery Orchestration Worker is down"
              description: "Recovery Orchestration Worker has been down for more than 2 minutes."

          # High Error Rate
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
              service: payment-watchdog-api
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} errors per second."

          # High Memory Usage
          - alert: HighMemoryUsage
            expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage is above 90% for {{ $labels.pod }}."

          # Database Connections
          - alert: TooManyDatabaseConnections
            expr: pg_stat_activity_count > 80
            for: 5m
            labels:
              severity: warning
              service: postgres
            annotations:
              summary: "Too many database connections"
              description: "PostgreSQL has {{ $value }} active connections."
