# Node Exporter for system metrics
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: payment-watchdog
        environment: sovereign-au
    spec:
      serviceAccountName: node-exporter
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.6.1
        imagePullPolicy: IfNotPresent
        args:
          - '--path.procfs=/host/proc'
          - '--path.rootfs=/host/root'
          - '--path.sysfs=/host/sys'
          - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)'
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host/root
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
          hostPath:
          path: /sys
      - name: root
          mountPath: /
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-exporter-sovereign-au
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-exporter-sovereign-au
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-exporter-sovereign-au
subjects:
  - kind: ServiceAccount
    name: node-exporter
    namespace: sovereign-au
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-sovereign-au
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
  annotations:
    prometheus.io/port: "9100"
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: node-exporter

---
# PostgreSQL Exporter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: payment-watchdog
        environment: sovereign-au
      annotations:
        prometheus.io/port: "9187"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: postgres-exporter
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.10.0
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://postgres:postgres_password@lexure-postgres-sovereign-au.sovereign-au.svc.cluster.local:5432/lexure_intelligence_mvp?sslmode=require"
        ports:
        - containerPort: 9187
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-sovereign-au
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
  annotations:
    prometheus.io/port: "9187"
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9187
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: postgres-exporter
