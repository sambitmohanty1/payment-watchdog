apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sovereign-au
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-sovereign-au
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
rules:
  # Prometheus needs to read metrics from pods, services, and endpoints
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  
  # For discovering services and endpoints
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  
  # For reading configmaps that contain scrape configs
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  
  # For reading persistent volume claims for storage monitoring
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-sovereign-au
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: payment-watchdog
    environment: sovereign-au
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-sovereign-au
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: sovereign-au
