apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-watchdog-ingress
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: payment-watchdog-tls
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: payment-watchdog-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-watchdog-web
                port:
                  number: 3011
