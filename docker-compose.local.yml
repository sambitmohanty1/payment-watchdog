version: '3.8'

services:
  payment-watchdog-local-api:
    build: 
      context: ./api
      dockerfile: Dockerfile.local
    ports:
      - "8096:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DATABASE_HOST=payment-watchdog-local-postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres_local
      - DATABASE_NAME=payment_watchdog_local
      - DATABASE_PORT=5432
      - DATABASE_SSL_MODE=disable
      - REDIS_URL=redis://payment-watchdog-local-redis:6379
      - STRIPE_SECRET_KEY=sk_test_dummy
      - STRIPE_WEBHOOK_SECRET=whsec_test_dummy
      - LOG_LEVEL=debug
      - ENVIRONMENT=local
      - SMTP_HOST=payment-watchdog-local-mailhog
      - SMTP_PORT=1025
    volumes:
      - ./api:/app
      - payment-watchdog-local-logs:/app/logs
    depends_on:
      payment-watchdog-local-postgres:
        condition: service_healthy
      payment-watchdog-local-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  payment-watchdog-local-web:
    build:
      context: ./web
      dockerfile: Dockerfile.local
    ports:
      - "3016:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8096
      - NEXT_PUBLIC_WS_URL=ws://localhost:8096
      - ENVIRONMENT=local
    volumes:
      - ./web:/app
      - /app/node_modules
      - payment-watchdog-local-web-logs:/app/.next
    depends_on:
      payment-watchdog-local-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  payment-watchdog-local-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.local
    environment:
      - DATABASE_HOST=payment-watchdog-local-postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres_local
      - DATABASE_NAME=payment_watchdog_local
      - DATABASE_PORT=5432
      - REDIS_URL=redis://payment-watchdog-local-redis:6379
      - LOG_LEVEL=debug
      - ENVIRONMENT=local
      - SMTP_HOST=payment-watchdog-local-mailhog
      - SMTP_PORT=1025
    volumes:
      - ./worker:/app
      - payment-watchdog-local-worker-logs:/app/logs
    depends_on:
      payment-watchdog-local-postgres:
        condition: service_healthy
      payment-watchdog-local-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  payment-watchdog-local-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local
      - POSTGRES_DB=payment_watchdog_local
    ports:
      - "5448:5432"
    volumes:
      - payment-watchdog-local-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - payment-watchdog-local-postgres-logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  payment-watchdog-local-redis:
    image: redis:7-alpine
    ports:
      - "6395:6379"
    volumes:
      - payment-watchdog-local-redis-data:/data
      - payment-watchdog-local-redis-logs:/var/log/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  payment-watchdog-local-mailhog:
    image: mailhog/mailhog
    ports:
      - "1041:1025"  # SMTP
      - "8041:8025"  # Web UI
    volumes:
      - payment-watchdog-local-mailhog-data:/maildir
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  # Optional: Local monitoring stack
  payment-watchdog-local-adminer:
    image: adminer:latest
    ports:
      - "8097:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=payment-watchdog-local-postgres
    depends_on:
      - payment-watchdog-local-postgres
    restart: unless-stopped
    networks:
      - payment-watchdog-local

  payment-watchdog-local-redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8098:8081"
    environment:
      - REDIS_HOSTS=local:payment-watchdog-local-redis:6379
    depends_on:
      - payment-watchdog-local-redis
    restart: unless-stopped
    networks:
      - payment-watchdog-local

volumes:
  payment-watchdog-local-postgres-data:
  payment-watchdog-local-redis-data:
  payment-watchdog-local-mailhog-data:
  payment-watchdog-local-logs:
  payment-watchdog-local-web-logs:
  payment-watchdog-local-worker-logs:
  payment-watchdog-local-postgres-logs:
  payment-watchdog-local-redis-logs:

networks:
  payment-watchdog-local:
    driver: bridge
