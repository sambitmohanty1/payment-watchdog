apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: postgres-component

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pvc.yaml
  - secret.yaml

labels:
  - pairs:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: payment-watchdog
    includeSelectors: true
    includeTemplates: true

# Generate secrets with proper values
secretGenerator:
  - name: postgres-secrets
    behavior: replace
    literals:
      - database_password=postgres

# ConfigMap generator for environment-specific overrides
configMapGenerator:
  - name: postgres-config
    behavior: replace
    literals:
      - database_name=payment_watchdog
      - database_user=postgres
