apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: redis-component

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pvc.yaml
  - secret.yaml

labels:
  - pairs:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
      app.kubernetes.io/part-of: payment-watchdog
    includeSelectors: true
    includeTemplates: true

# Generate secrets with proper values
secretGenerator:
  - name: redis-secrets
    behavior: replace
    literals:
      - redis_password=redis
