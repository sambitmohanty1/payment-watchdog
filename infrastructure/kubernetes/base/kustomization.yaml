apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base components shared across all environments
resources:
  # Infrastructure components
  - components/postgres
  - components/redis
  - components/storage
  
  # Application services
  - services/api
  - services/worker
  - services/web
  - serviceaccount.yaml

# Common labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/part-of: payment-watchdog
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
    includeTemplates: true

# Common annotations
commonAnnotations:
  config.kubernetes.io/origin: infrastructure/kubernetes/base

# Reproducible builds
generatorOptions:
  disableNameSuffixHash: false
