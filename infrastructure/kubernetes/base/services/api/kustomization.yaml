apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: api-service

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - hpa.yaml
  - serviceaccount.yaml

labels:
  - pairs:
      app.kubernetes.io/name: payment-watchdog-api
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: payment-watchdog
    includeSelectors: true
    includeTemplates: true

images:
  - name: payment-watchdog/api
    newName: ghcr.io/sambitmohanty1/payment-watchdog/api
    newTag: latest
