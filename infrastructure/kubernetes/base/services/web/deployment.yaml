apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-watchdog-web
  labels:
    app.kubernetes.io/name: payment-watchdog-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: payment-watchdog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-watchdog-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-watchdog-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: payment-watchdog
    spec:
      containers:
      - name: payment-watchdog-web
        image: ghcr.io/sambitmohanty1/payment-watchdog/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: NEXT_PUBLIC_API_URL
          value: "http://payment-watchdog-api.production.svc.cluster.local"
        - name: NEXT_PUBLIC_DEV_PROXY_BYPASS
          value: "true"
        - name: NEXT_PUBLIC_LOCALHOST_BYPASS
          value: "true"
        - name: NO_PROXY
          value: "localhost,127.0.0.1,::1,payment-watchdog-api.production.svc.cluster.local"
        - name: no_proxy
          value: "localhost,127.0.0.1,::1,payment-watchdog-api.production.svc.cluster.local"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: payment-watchdog-web-config
