apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: web-service

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

labels:
  - pairs:
      app.kubernetes.io/name: payment-watchdog-web
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: payment-watchdog
    includeSelectors: true
    includeTemplates: true

images:
  - name: payment-watchdog/web
    newName: ghcr.io/sambitmohanty1/payment-watchdog/web
    newTag: latest
