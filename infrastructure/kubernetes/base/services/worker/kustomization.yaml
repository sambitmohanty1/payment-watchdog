apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: recovery-orchestration-service

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/name: recovery-orchestration
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: payment-watchdog
    includeSelectors: true
    includeTemplates: true

# Images will be set by environment overlays
images:
  - name: payment-watchdog/worker
    newName: ghcr.io/sambitmohanty1/payment-watchdog/worker
    newTag: latest
