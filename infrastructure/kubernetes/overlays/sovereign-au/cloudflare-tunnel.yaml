apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  labels:
    app: cloudflare-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      containers:
      - name: tunnel
        image: docker.io/cloudflare/cloudflared:latest
        args:
        - tunnel
        - "--no-autoupdate"
        - run
        - "--token"
        - valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-secret
              key: tunnel-token
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
