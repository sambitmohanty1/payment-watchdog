apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sovereign-au-overlay

# Include all base components and services
resources:
  - namespace.yaml
  - network-policy.yaml
  - global-config.yaml
  - ../../base/components/postgres
  - ../../base/components/redis
  - ../../base/services/api
  - ../../base/services/worker
  - ../../base/services/web

# Environment-specific namespace
namespace: sovereign-au

# Name suffix for all resources
nameSuffix: "-sovereign-au"

# Environment-specific labels
labels:
  - pairs:
      environment: sovereign-au
      data-residency: australia
    includeSelectors: true
    includeTemplates: true

# Images for sovereign environment
images:
  - name: ghcr.io/sambitmohanty1/payment-watchdog/api
    newName: ghcr.io/sambitmohanty1/payment-watchdog/api
    newTag: latest
  - name: ghcr.io/sambitmohanty1/payment-watchdog/worker
    newName: ghcr.io/sambitmohanty1/payment-watchdog/worker
    newTag: latest
  - name: ghcr.io/sambitmohanty1/payment-watchdog/web
    newName: ghcr.io/sambitmohanty1/payment-watchdog/web
    newTag: latest
  # OKE CRI-O enforces fully qualified image names - short names like 'postgres:15-alpine' are rejected
  - name: postgres
    newName: docker.io/library/postgres
    newTag: 15-alpine
  - name: redis
    newName: docker.io/library/redis
    newTag: 7-alpine

# Patches for sovereign-specific configurations
patches:
  # Add image pull secrets only to GHCR-based deployments (not postgres/redis which use Docker Hub)
  - target:
      kind: Deployment
      name: payment-watchdog-api
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret
  - target:
      kind: Deployment
      name: payment-watchdog-web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret
  - target:
      kind: Deployment
      name: recovery-orchestration
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret
  - target:
      kind: ServiceAccount
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: ghcr-secret
  - target:
      kind: ServiceAccount
      name: recovery-orchestration
    patch: |-
      - op: remove
        path: /metadata/annotations/iam.amazonaws.com~1role
      - op: add
        path: /metadata/annotations/oracle.com~1auth
        value: "oci-identity"
  
  # Use cluster default OCI Block Volume StorageClass (provisioner: blockvolume.csi.oraclecloud.com)
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: oci-bv
  - target:
      kind: PersistentVolumeClaim
      name: redis-pvc
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: oci-bv

  # API service configuration patch - CRITICAL for fixing pod crashes
  - target:
      kind: ConfigMap
      name: payment-watchdog-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: payment-watchdog-config
      data:
        config.yaml: |
          server:
            port: 8085
            environment: sovereign-au
            logLevel: info
            shutdownTimeout: 30s
            
          database:
            host: postgres-sovereign-au.sovereign-au.svc.cluster.local
            port: 5432
            name: payment_watchdog
            sslMode: require
            maxIdleConns: 10
            maxOpenConns: 100
            connMaxLifetime: 1h
            
          redis:
            addr: redis-sovereign-au.sovereign-au.svc.cluster.local:6379
            db: 0
            poolSize: 100
            
          providers:
            stripe:
              apiVersion: 2020-08-27
              timeout: 30s
            xero:
              apiVersion: 2.0
              timeout: 30s
            quickbooks:
              apiVersion: 6.0
              timeout: 30s
            
          notifications:
            email:
              enabled: true
              from: no-reply@payment-watchdog.com
              retryAttempts: 3
            sms:
              enabled: true
              from: PAYMENT_WATCHDOG
              retryAttempts: 3

  # Web deployment environment patch - CRITICAL for fixing pod proxy loops
  - target:
      kind: Deployment
      name: payment-watchdog-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-watchdog-web
      spec:
        template:
          spec:
            containers:
            - name: payment-watchdog-web
              env:
              - name: NEXT_PUBLIC_API_URL
                value: "http://payment-watchdog-api-sovereign-au.sovereign-au.svc.cluster.local:80"
              - name: NO_PROXY
                value: "localhost,127.0.0.1,::1,payment-watchdog-api-sovereign-au.sovereign-au.svc.cluster.local"
              - name: no_proxy
                value: "localhost,127.0.0.1,::1,payment-watchdog-api-sovereign-au.sovereign-au.svc.cluster.local"

  # Worker service configuration patch - CRITICAL for fixing pod crashes
  - target:
      kind: ConfigMap
      name: worker-config
    patch: |-
      - op: replace
        path: /data/config.yaml
        value: |
          service:
            name: recovery-orchestration
            port: 8086
            environment: sovereign-au
            log_level: info
            host: 0.0.0.0
            
          database:
            host: postgres-sovereign-au.sovereign-au.svc.cluster.local
            port: 5432
            name: payment_watchdog
            user: postgres
            ssl_mode: require
            max_idle_conns: 10
            max_open_conns: 100
            conn_max_lifetime: 1h
            
          redis:
            addr: redis-sovereign-au.sovereign-au.svc.cluster.local:6379
            password: redis
            db: 0
            pool_size: 100
            connect_timeout: 10s
            max_retries: 3
            
          sovereign:
            mode: true
            validate_endpoints: true
            data_residency: australia
            allowed_regions:
              - ap-southeast-2
              - ap-southeast-3
              
          workflow:
            max_concurrent_workflows: 100
            max_retry_attempts: 3
            retry_delay: 5m
            timeout: 30m
            
          observability:
            metrics:
              enabled: true
              path: /metrics
              port: 9090
            tracing:
              enabled: true
              sample_rate: 1.0
              exporter: otlp
              endpoint: http://otel-collector.observability.svc.cluster.local:4317
              
          notifications:
            email:
              enabled: true
              from: noreply@paymentwatchdog.com
              smtp_host: localhost
              smtp_port: 1025
              retry_attempts: 3
            sms:
              enabled: true
              from: PAYMENT_WATCHDOG
              provider: twilio
              retry_attempts: 3
  # Patch for postgres secrets
  - target:
      kind: Secret
      name: postgres-secrets
    patch: |-
      - op: replace
        path: /data
        value:
          database_password: cG9zdGdyZXM=  # postgres

  # Patch for redis secrets  
  - target:
      kind: Secret
      name: redis-secrets
    patch: |-
      - op: replace
        path: /data
        value:
          redis_password: cmVkaXM=  # redis

# Add resource requests and limits for sovereign environment
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  
  # Fix worker environment for sovereign deployment
  - target:
      kind: Deployment
      name: recovery-orchestration
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: recovery-orchestration
      spec:
        template:
          spec:
            containers:
            - name: recovery-orchestration
              env:
              - name: ENVIRONMENT
                value: "sovereign-au"
              - name: SOVEREIGN_MODE
                value: "true"

# Replicas for sovereign environment
replicas:
  - name: postgres
    count: 1
  - name: redis
    count: 1
  - name: recovery-orchestration
    count: 2
