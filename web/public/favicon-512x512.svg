<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </radialGradient>
    <linearGradient id="scaleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>
  
  <!-- Outer rings for trust/regulatory -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#10b981" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.1"/>
  
  <!-- Balance scale frame -->
  <rect x="96" y="224" width="320" height="16" fill="url(#scaleGradient)" rx="8" filter="url(#glow)"/>
  
  <!-- Left scale pan -->
  <rect x="128" y="96" width="32" height="128" fill="url(#scaleGradient)" rx="8" filter="url(#glow)"/>
  <circle cx="144" cy="80" r="16" fill="url(#scaleGradient)" filter="url(#glow)"/>
  
  <!-- Right scale pan -->
  <rect x="352" y="96" width="32" height="128" fill="url(#scaleGradient)" rx="8" filter="url(#glow)"/>
  <circle cx="368" cy="80" r="16" fill="url(#scaleGradient)" filter="url(#glow)"/>
  
  <!-- Currency symbol (dollar sign) -->
  <text x="256" y="336" font-family="Arial, sans-serif" font-size="128" font-weight="bold" text-anchor="middle" fill="#10b981" filter="url(#glow)">$</text>
  
  <!-- Trust indicators -->
  <circle cx="64" cy="256" r="16" fill="#10b981" opacity="0.9" filter="url(#glow)"/>
  <circle cx="448" cy="256" r="16" fill="#10b981" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="448" r="16" fill="#10b981" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Additional trust indicators -->
  <circle cx="128" cy="128" r="8" fill="#6366f1" opacity="0.6"/>
  <circle cx="384" cy="128" r="8" fill="#6366f1" opacity="0.6"/>
  <circle cx="128" cy="384" r="8" fill="#6366f1" opacity="0.6"/>
  <circle cx="384" cy="384" r="8" fill="#6366f1" opacity="0.6"/>
  
  <!-- Grid pattern for regulatory feel -->
  <g opacity="0.05">
    <line x1="64" y1="64" x2="448" y2="64" stroke="#6366f1" stroke-width="2"/>
    <line x1="64" y1="448" x2="448" y2="448" stroke="#6366f1" stroke-width="2"/>
    <line x1="64" y1="64" x2="64" y2="448" stroke="#6366f1" stroke-width="2"/>
    <line x1="448" y1="64" x2="448" y2="448" stroke="#6366f1" stroke-width="2"/>
    
    <line x1="160" y1="160" x2="352" y2="160" stroke="#6366f1" stroke-width="1"/>
    <line x1="160" y1="352" x2="352" y2="352" stroke="#6366f1" stroke-width="1"/>
    <line x1="160" y1="160" x2="160" y2="352" stroke="#6366f1" stroke-width="1"/>
    <line x1="352" y1="160" x2="352" y2="352" stroke="#6366f1" stroke-width="1"/>
  </g>
  
  <!-- Subtle decorative elements -->
  <g opacity="0.3">
    <circle cx="96" cy="96" r="2" fill="#10b981"/>
    <circle cx="416" cy="96" r="2" fill="#10b981"/>
    <circle cx="96" cy="416" r="2" fill="#10b981"/>
    <circle cx="416" cy="416" r="2" fill="#10b981"/>
  </g>
</svg>
